name: Verify handbook retrieval
on: [push, pull_request]
permissions:
  contents: read
jobs:
  retrieval:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python handbook.py index examples/handbook
      - run: python handbook.py eval examples/queries.json -k 3
