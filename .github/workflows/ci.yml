name: Verify ticket routing
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest -v
      - run: python triage.py fit examples/train.jsonl examples/calibration.jsonl --model model.json
      - run: python triage.py evaluate examples/holdout.jsonl --model model.json
      - run: python compare_policies.py
      - uses: actions/checkout@v7
        if: matrix.python == '3.12'
        with:
          repository: peca12968/batch-parity
          ref: aaa6b948af2da875946f9a96a12731e10c5f774b
          path: parity-checkout
          persist-credentials: false
      - if: matrix.python == '3.12'
        run: "python -m pip install --only-binary=:all: -r requirements-onnx.txt"
      - if: matrix.python == '3.12'
        run: python onnx_drill.py parity-checkout/check.py
