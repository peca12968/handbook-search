name: Verify ticket routing
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest -v
      - run: python triage.py fit examples/train.jsonl examples/calibration.jsonl --model model.json
      - run: python triage.py evaluate examples/holdout.jsonl --model model.json
      - run: python compare_policies.py
