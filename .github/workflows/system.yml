name: Verify handbook-search system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  retrieval:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python:
        - '3.12'
        - '3.13'
    env:
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m unittest -v
    - run: python sync_demo.py
    - run: python handbook.py index examples/handbook
    - run: python handbook.py eval examples/queries.json -k 3
    - uses: actions/checkout@v4
      if: matrix.python == '3.12'
      with:
        ref: 68ba4b7d07522cf2a0c8cccd8da080ec52aedc59
        path: vector-checkout
        persist-credentials: false
    - if: matrix.python == '3.12'
      run: 'python -m pip install --only-binary=:all: -r vector-checkout/requirements.txt'
    - if: matrix.python == '3.12'
      run: python scope_demo.py vector-checkout/sieve.py
  vector-sieve-recall:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: 'python -m pip install --only-binary=:all: -r requirements.txt'
    - run: python -m unittest -v
    - run: python demo.py
    defaults:
      run:
        working-directory: modules/vector-sieve
